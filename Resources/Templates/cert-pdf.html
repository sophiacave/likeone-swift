<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@page {
    size: A4 landscape;
    margin: 0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #fdfcf8;
    color: #221d33;
}
.cert-pdf {
    width: 297mm;
    height: 210mm;
    position: relative;
    overflow: hidden;
}

/* Background — warm ivory with a faint vignette */
.cert-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(160deg, #fffefb 0%, #fdfcf8 45%, #f7f3ea 100%);
}

/* Double border — outer hairline */
.border-outer {
    position: absolute;
    top: 8mm; left: 8mm; right: 8mm; bottom: 8mm;
    border: 1px solid #c9a96a55;
}
/* Double border — inner */
.border-inner {
    position: absolute;
    top: 12mm; left: 12mm; right: 12mm; bottom: 12mm;
    border: 1.5px solid #a8863d80;
}

/* Gold accent line at top */
.border-inner::before {
    content: '';
    position: absolute;
    top: -1px; left: 30mm; right: 30mm;
    height: 2px;
    background: linear-gradient(90deg, transparent, #a8863d, #d4b97e, #a8863d, transparent);
}
/* Gold accent line at bottom */
.border-inner::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 30mm; right: 30mm;
    height: 2px;
    background: linear-gradient(90deg, transparent, #a8863d, #d4b97e, #a8863d, transparent);
}

/* Corner flourishes */
.corner { position: absolute; z-index: 2; }
.corner svg { display: block; }
.corner-tl { top: 11mm; left: 11mm; }
.corner-tr { top: 11mm; right: 11mm; transform: scaleX(-1); }
.corner-bl { bottom: 11mm; left: 11mm; transform: scaleY(-1); }
.corner-br { bottom: 11mm; right: 11mm; transform: scale(-1); }

/* Content — flex column centering (WeasyPrint drops abs+transform overflow) */
.cert-inner {
    position: absolute;
    top: 12mm; left: 12mm; right: 12mm; bottom: 12mm;
    z-index: 1;
    text-align: center;
    padding: 0 35mm 22mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.cert-body-block {
    text-align: center;
}

/* Institution header */
.cert-institution {
    text-align: center;
    margin-bottom: 4mm;
}
.cert-logo {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 26pt;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #221d33;
}
.cert-logo .accent { color: #6d28d9; }
.cert-academy-label {
    font-size: 7pt;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    color: #8a8494;
    margin-top: 1mm;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}

/* Ornamental divider */
.divider {
    display: flex;
    align-items: center;
    gap: 3mm;
    margin: 0 auto 5mm;
    width: 80mm;
}
.divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #a8863d90, transparent);
}
.divider-diamond {
    width: 5px; height: 5px;
    background: {{BADGE_COLOR}};
    transform: rotate(45deg);
}

/* Certificate type */
.cert-type {
    font-size: 8.5pt;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #a8863d;
    margin-bottom: 6mm;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}

/* Formal text */
.cert-preamble {
    font-size: 9.5pt;
    color: #6f6a7d;
    font-style: italic;
    margin-bottom: 3.5mm;
    letter-spacing: 0.02em;
}
.cert-recipient {
    font-size: 34pt;
    font-weight: normal;
    color: #221d33;
    letter-spacing: 0.01em;
    line-height: 1.15;
    white-space: nowrap;
}
.cert-recipient-rule {
    width: 70mm;
    height: 1px;
    margin: 3mm auto 4mm;
    background: linear-gradient(90deg, transparent, #a8863d70, transparent);
}
.cert-has-completed {
    font-size: 9.5pt;
    color: #6f6a7d;
    font-style: italic;
    margin-bottom: 3.5mm;
    letter-spacing: 0.02em;
}
.cert-course-title {
    font-size: 17pt;
    font-weight: normal;
    color: #6d28d9;
    margin-bottom: 6mm;
    line-height: 1.25;
    font-style: italic;
}

/* Seal */
.cert-seal {
    width: 22mm;
    height: 22mm;
    border: 1.5px solid #a8863d90;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 3mm;
    position: relative;
    background: #faf6ec;
}
.cert-seal::before {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 2px; bottom: 2px;
    border: 0.5px solid #a8863d50;
    border-radius: 50%;
}
.cert-seal-text {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 6pt;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #8a6d2f;
    text-align: center;
    line-height: 1.3;
}
.cert-seal-text strong {
    display: block;
    font-size: 7pt;
    letter-spacing: 0.05em;
}

.cert-date {
    font-size: 8pt;
    color: #8a8494;
    letter-spacing: 0.05em;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
}

/* Footer with signature + verification */
.cert-footer {
    position: absolute;
    bottom: 10mm;
    left: 35mm;
    right: 35mm;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 1px solid #e4ddcd;
    padding-top: 5mm;
}
.cert-signature { text-align: left; }
.cert-sig-line {
    width: 50mm;
    border-bottom: 1px solid #8a8494;
    margin-bottom: 2mm;
}
.cert-sig-name {
    font-size: 10pt;
    color: #221d33;
    font-style: italic;
}
.cert-sig-role {
    font-size: 7pt;
    color: #8a8494;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 1mm;
}
.cert-verify-block { text-align: right; }
.cert-id {
    font-size: 6pt;
    color: #8a8494;
    font-family: 'Menlo', 'Courier New', monospace;
    margin-bottom: 1mm;
}
.cert-verify-url {
    font-size: 5.5pt;
    color: #a39d8e;
    font-family: 'Menlo', 'Courier New', monospace;
}
</style>
</head>
<body>
<div class="cert-pdf">
    <div class="cert-bg"></div>
    <div class="border-outer"></div>
    <div class="border-inner"></div>

    <!-- Corner flourishes (gold) -->
    <div class="corner corner-tl">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M0 18 L0 0 L18 0" stroke="#a8863d" stroke-width="0.7" stroke-opacity="0.55" fill="none"/>
            <path d="M0 14 L0 4 Q0 0 4 0 L14 0" stroke="#a8863d" stroke-width="0.4" stroke-opacity="0.35" fill="none"/>
            <circle cx="0" cy="0" r="1.5" fill="#a8863d" fill-opacity="0.45"/>
        </svg>
    </div>
    <div class="corner corner-tr">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M0 18 L0 0 L18 0" stroke="#a8863d" stroke-width="0.7" stroke-opacity="0.55" fill="none"/>
            <path d="M0 14 L0 4 Q0 0 4 0 L14 0" stroke="#a8863d" stroke-width="0.4" stroke-opacity="0.35" fill="none"/>
            <circle cx="0" cy="0" r="1.5" fill="#a8863d" fill-opacity="0.45"/>
        </svg>
    </div>
    <div class="corner corner-bl">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M0 18 L0 0 L18 0" stroke="#a8863d" stroke-width="0.7" stroke-opacity="0.55" fill="none"/>
            <path d="M0 14 L0 4 Q0 0 4 0 L14 0" stroke="#a8863d" stroke-width="0.4" stroke-opacity="0.35" fill="none"/>
            <circle cx="0" cy="0" r="1.5" fill="#a8863d" fill-opacity="0.45"/>
        </svg>
    </div>
    <div class="corner corner-br">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M0 18 L0 0 L18 0" stroke="#a8863d" stroke-width="0.7" stroke-opacity="0.55" fill="none"/>
            <path d="M0 14 L0 4 Q0 0 4 0 L14 0" stroke="#a8863d" stroke-width="0.4" stroke-opacity="0.35" fill="none"/>
            <circle cx="0" cy="0" r="1.5" fill="#a8863d" fill-opacity="0.45"/>
        </svg>
    </div>

    <div class="cert-inner">
        <div class="cert-body-block">
            <!-- Institution -->
            <div class="cert-institution">
                <div class="cert-logo">like<span class="accent">one</span></div>
                <div class="cert-academy-label">Academy</div>
            </div>

            <!-- Ornamental divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-diamond"></div>
                <div class="divider-line"></div>
            </div>

            <!-- Certificate type -->
            <div class="cert-type">{{CERT_TYPE_LABEL}}</div>

            <!-- Formal body -->
            <div class="cert-preamble">This is to certify that</div>
            <div class="cert-recipient">{{RECIPIENT_NAME}}</div>
            <div class="cert-recipient-rule"></div>
            <div class="cert-has-completed">has successfully completed the requirements for</div>
            <div class="cert-course-title">{{CERT_TITLE}}</div>

            <!-- Seal -->
            <div class="cert-seal">
                <div class="cert-seal-text">
                    <strong>L1</strong>
                    Verified
                </div>
            </div>

            <div class="cert-date">Issued {{EARNED_DATE}}</div>
        </div>

        <!-- Footer -->
        <div class="cert-footer">
            <div class="cert-signature">
                <div class="cert-sig-line"></div>
                <div class="cert-sig-name">Sophia Cave</div>
                <div class="cert-sig-role">Founder &amp; Executive Director</div>
            </div>
            <div class="cert-verify-block">
                <div class="cert-id">ID: {{CERT_ID}}</div>
                <div class="cert-verify-url">Verify: likeone.ai/cert/{{CERT_ID}}</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
