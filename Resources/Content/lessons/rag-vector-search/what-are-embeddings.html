<div class="wrap">





  <div class="section">
    <h2>The Core Idea</h2>
    <div class="lo-visual" role="figure" aria-label="Words with similar meanings cluster together in embedding space">

  <div class="lo-compare">
    <div class="lo-compare__side" style="background:var(--v-green-bg);border:1px solid var(--v-green-border);text-align:center;padding:1.25rem;">

      <div style="font-size:.85rem;color:var(--v-green);margin-bottom:.25rem;">happy</div>
      <div style="font-size:.8rem;color:var(--v-green);opacity:.7;margin-bottom:.15rem;">joyful</div>
      <div style="font-size:.75rem;color:var(--v-green);opacity:.5;">glad &bull; elated</div>
      <div style="font-size:.65rem;color:var(--v-muted);margin-top:.5rem;">close together = similar meaning</div>
    </div>
    <div class="lo-compare__divider" style="color:var(--v-faint);font-size:.8rem;">far<br>apart</div>
    <div class="lo-compare__side" style="background:var(--v-purple-bg);border:1px solid var(--v-purple-border);text-align:center;padding:1.25rem;">

      <div style="font-size:.8rem;color:var(--v-purple);opacity:.7;margin-bottom:.15rem;">server</div>
