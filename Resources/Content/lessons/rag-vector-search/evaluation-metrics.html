<div class="wrap">





  <div class="section">
    <h2>The RAG Quality Triangle</h2>
    <div class="lo-vis" role="figure" aria-label="Three tests: relevance, faithfulness, completeness">
  <div class="lo-vis__title">The RAG Quality Triangle</div>
  <div class="lo-steps" data-count="3">
    <div class="lo-step lo-step--green"><div class="lo-step__num">1</div><div class="lo-step__label">Relevance</div><div class="lo-step__desc">Did we find<br>the right context?</div></div>
    <div class="lo-steps__arrow">+</div>
    <div class="lo-step lo-step--purple"><div class="lo-step__num">2</div><div class="lo-step__label">Faithfulness</div><div class="lo-step__desc">Does answer<br>match context?</div></div>
    <div class="lo-steps__arrow">+</div>
    <div class="lo-step lo-step--orange"><div class="lo-step__num">3</div><div class="lo-step__label">Completeness</div><div class="lo-step__desc">Did we cover<br>everything?</div></div>
  </div>
  <div class="lo-vis__caption">All three must pass. <strong>Failing any one = unreliable answer.</strong></div>
</div>
