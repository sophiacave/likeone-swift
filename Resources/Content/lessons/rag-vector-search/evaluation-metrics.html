<div class="wrap">





  <div class="section">
    <h2>The RAG Quality Triangle</h2>
    <div class="lo-visual" role="figure" aria-label="Three tests: relevance, faithfulness, completeness">
  <div class="lo-visual__title">The RAG Quality Triangle</div>
  <div class="lo-flow" data-steps="3">
    <div class="lo-flow__step lo-flow__step--green"><div class="lo-flow__step-num">1</div><div class="lo-flow__step-label">Relevance</div><div class="lo-flow__step-detail">Did we find<br>the right context?</div></div>
    <div class="lo-flow__arrow">+</div>
    <div class="lo-flow__step lo-flow__step--purple"><div class="lo-flow__step-num">2</div><div class="lo-flow__step-label">Faithfulness</div><div class="lo-flow__step-detail">Does answer<br>match context?</div></div>
    <div class="lo-flow__arrow">+</div>
    <div class="lo-flow__step lo-flow__step--orange"><div class="lo-flow__step-num">3</div><div class="lo-flow__step-label">Completeness</div><div class="lo-flow__step-detail">Did we cover<br>everything?</div></div>
  </div>
  <div class="lo-visual__caption">All three must pass. <strong>Failing any one = unreliable answer.</strong></div>
</div>
