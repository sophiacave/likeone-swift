<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="520" width="120" height="4" rx="2" fill="url(#accent)"/>
  
  <!-- VS divider -->
  <circle cx="600" cy="260" r="40" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>
  <text x="600" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#8b5cf6" text-anchor="middle">VS</text>
  
  <!-- Sonnet side -->
  <text x="350" y="250" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="700" fill="#a78bfa" text-anchor="middle">Sonnet</text>
  <text x="350" y="290" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#666" text-anchor="middle">Fast · Affordable · 80% of tasks</text>
  
  <!-- Opus side -->
  <text x="850" y="250" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="700" fill="#f5f5f5" text-anchor="middle">Opus</text>
  <text x="850" y="290" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#666" text-anchor="middle">Deep reasoning · Complex tasks</text>
  
  <!-- Title -->
  <text x="600" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="600" fill="#e5e5e5" text-anchor="middle">Which Claude Model Should You Use?</text>
  <text x="600" y="460" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#888" text-anchor="middle">A practical guide for developers and builders</text>
  
  <!-- Brand -->
  <text x="60" y="555" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#8b5cf6">likeone.ai</text>
  <text x="60" y="580" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#555">June 2026</text>
</svg>